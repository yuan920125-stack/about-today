<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5ecdf">
  <meta name="description" content="日常以外，收藏生活碎片。">
  <title>日常以外 — Somewhere, in my life</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2213%22%20fill%3D%22%23f6f0e7%22/%3E%3Cpath%20d%3D%22M10%2018q12-6%2022%201v28q-10-7-22-1z%20M54%2018q-12-6-22%201v28q10-7%2022-1z%22%20fill%3D%22none%22%20stroke%3D%22%23493329%22%20stroke-width%3D%223%22/%3E%3C/svg%3E">
  <style>
    :root {
      --paper: #f5ecdf;
      --cream: #fff9ef;
      --ink: #45352b;
      --muted: #8c7565;
      --rust: #a65335;
      --gold: #bc8b4e;
      --line: #dbc8b3;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: Georgia, "Noto Serif TC", "Songti TC", serif;
      line-height: 2;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .page {
      max-width: 1000px;
      margin: auto;
      padding: 28px 32px 55px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--line);
      padding-bottom: 17px;
      gap: 20px;
    }

    .brand {
      font-size: 24px;
      letter-spacing: 1px;
      line-height: 1.4;
    }

    .brand .small {
      display: block;
      margin-top: 4px;
    }

    .small {
      font: 10px/1.8 Arial, "Noto Sans TC", sans-serif;
      letter-spacing: 2.2px;
      text-transform: uppercase;
      color: var(--muted);
    }

    .header-date {
      text-align: right;
      white-space: nowrap;
    }

    /* Hero section */

    .hero {
      padding: 68px 130px 48px 0;
      position: relative;
    }

    .hero .small {
      color: var(--rust);
    }

    h1 {
      font-size: clamp(42px, 7vw, 68px);
      font-weight: 400;
      line-height: 1.45;
      letter-spacing: 2px;
      margin: 16px 0;
    }

    .hero p {
      font-size: 14px;
      color: var(--muted);
      max-width: 550px;
      margin: 0;
    }

    .leaf {
      position: absolute;
      right: 5%;
      top: 65px;
      font-size: 90px;
      opacity: .22;
      transform: rotate(-20deg);
      pointer-events: none;
    }

    /* Section divider */

    .divider {
      display: flex;
      align-items: center;
      gap: 15px;
      margin-bottom: 24px;
    }

    .divider:after {
      content: "";
      height: 1px;
      background: var(--line);
      flex: 1;
    }

    /* Journal cards */

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 26px;
    }

    .card {
      display: block;
      background: var(--cream);
      border: 1px solid #e5d4c0;
      box-shadow: 0 12px 32px rgba(91, 57, 33, .055);
      transition: transform .2s, box-shadow .2s;
      overflow: hidden;
    }

    .card:hover,
    .card:focus-visible {
      transform: translateY(-4px);
      box-shadow: 0 18px 42px rgba(91, 57, 33, .12);
    }

    .cover {
      aspect-ratio: 16/10;
      background: #e9ddcc;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .cover img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .cover-placeholder {
      font-size: 60px;
      opacity: .65;
    }

    .card-content {
      padding: 24px 28px 30px;
    }

    .entry-date {
      color: var(--rust);
      font: 11px Arial, "Noto Sans TC", sans-serif;
      letter-spacing: 2px;
    }

    .card h2 {
      font-size: 25px;
      font-weight: 400;
      margin: 12px 0 8px;
      line-height: 1.5;
    }

    .card p {
      font-size: 13px;
      color: var(--muted);
      line-height: 2;
      margin: 0 0 16px;
    }

    .read-more {
      font: 11px Arial, sans-serif;
      letter-spacing: 2px;
      color: var(--rust);
    }

    /* Full journal article */

    .article {
      background: var(--cream);
      border: 1px solid #e5d4c0;
      box-shadow: 0 18px 45px rgba(91, 57, 33, .055);
      padding: 42px clamp(24px, 6vw, 68px) 55px;
    }

    .article h2 {
      font-weight: 400;
      font-size: clamp(28px, 5vw, 42px);
      line-height: 1.4;
      margin: 16px 0 28px;
    }

    .article-cover {
      display: block;
      max-width: min(100%, 490px);
      max-height: 520px;
      object-fit: contain;
      margin: 0 auto 35px;
      filter: grayscale(1);
    }

    .prose {
      font-size: 15px;
      line-height: 2.4;
      letter-spacing: .35px;
    }

    .prose p {
      margin: 0 0 23px;
    }

    .prose p:first-child::first-letter {
      font-size: 32px;
      color: var(--rust);
    }

    .endmark {
      text-align: center;
      margin-top: 32px;
      color: var(--gold);
      letter-spacing: 12px;
    }

    .back {
      display: inline-block;
      margin: 0 0 24px;
      color: var(--rust);
      font: 12px Arial, sans-serif;
      letter-spacing: 1.5px;
    }

    /* About section */

    .about {
      margin-top: 70px;
      padding: 25px 0 10px;
      border-top: 1px solid var(--line);
    }

    .about h3 {
      font-weight: 400;
      font-size: 24px;
      margin: 8px 0;
    }

    .about p {
      color: var(--muted);
      font-size: 13px;
      max-width: 520px;
    }

    /* Footer */

    footer {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 45px;
      padding-top: 17px;
      border-top: 1px solid var(--line);
    }

    .hidden {
      display: none !important;
    }

    /* Mobile layout */

    @media (max-width: 600px) {
      .page {
        padding: 19px 18px 35px;
      }

      .hero {
        padding: 50px 60px 35px 0;
      }

      .leaf {
        right: 0;
        top: 42px;
        font-size: 60px;
      }

      .grid {
        grid-template-columns: 1fr;
      }

      .article {
        padding: 28px 23px 35px;
      }

      .prose {
        font-size: 14px;
      }

      .header-date {
        font-size: 9px;
      }
    }
  </style>
</head>

<body>
  <div class="page">

    <!-- Header -->
    <header>
      <a class="brand" href="./index.html">
        日常以外.
        <span class="small">Somewhere, in my life</span>
      </a>

      <div class="header-date small" id="today"></div>
    </header>

    <main>

      <!-- Homepage -->
      <div id="home">

        <section class="hero">
          <span class="small">A RECORD OF BEING ALIVE</span>

          <h1>
            生活沒有答案，<br>
            但值得記下來。
          </h1>

          <p>
            微風、散落的片刻，還有那些不想忘記的日常細節。
          </p>

          <div class="leaf" aria-hidden="true">🍂</div>
        </section>

        <div class="divider">
          <span class="small">THE JOURNAL</span>
        </div>

        <!-- Journal cards are generated here -->
        <div id="cards" class="grid"></div>

      </div>

      <!-- Full diary page -->
      <div id="detail" class="hidden">
        <div style="padding-top: 40px">

          <a class="back" href="./index.html">
            ← BACK TO JOURNAL
          </a>

          <article class="article" id="article"></article>

        </div>
      </div>

      <!-- About -->
      <section class="about">
        <div class="small">ABOUT THIS SPACE</div>

        <h3>關於這裡。</h3>

        <p>
          收藏不需要特別理由的日常。偶爾好笑，偶爾狼狽，
          但都是生活確實發生過的證明。
        </p>
      </section>

    </main>

    <!-- Footer -->
    <footer class="small">
      <span>JUST WORDS. JUST LIFE.</span>

      <span>
        MADE FOR QUIET DAYS ©
        <span id="year"></span>
      </span>
    </footer>

  </div>

  <!-- Diary data -->
  <script src="diaries.js"></script>

  <!-- Website logic -->
  <script>
    // Current date
    const now = new Date();

    document.getElementById('today').textContent =
      new Intl.DateTimeFormat('en-US', {
        year: 'numeric',
        month: 'short',
        day: 'numeric'
      }).format(now);

    document.getElementById('year').textContent =
      now.getFullYear();

    // Load and sort diaries
    const entries = Array.isArray(window.DIARIES)
      ? [...window.DIARIES].sort((a, b) => b.date.localeCompare(a.date))
      : [];

    // Escape HTML characters
    const escapeHTML = s =>
      String(s ?? '').replace(/[&<>"']/g, c => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      }[c]));

    // Format diary date
    const formatDate = s => {
      const d = new Date(s + 'T12:00:00');

      return Number.isNaN(d.getTime())
        ? s
        : new Intl.DateTimeFormat('en-US', {
            month: 'long',
            day: 'numeric',
            year: 'numeric'
          }).format(d).toUpperCase();
    };

    // Generate cover image or placeholder
    const cover = (e, cls) =>
      e.image
        ? `<img
             src="${escapeHTML(e.image)}"
             alt="${escapeHTML(e.imageAlt || e.title)}"
             loading="lazy"
           >`
        : `<span class="cover-placeholder" aria-hidden="true">✧</span>`;

    // Get selected diary from URL
    const id = new URLSearchParams(location.search).get('post');

    const selected = entries.find(e => e.id === id);

    // Display full diary
    if (selected) {
      document.getElementById('home').classList.add('hidden');
      document.getElementById('detail').classList.remove('hidden');

      document.title = selected.title + ' — 日常以外';

      const paras = (selected.paragraphs || [])
        .map(p => `<p>${escapeHTML(p)}</p>`)
        .join('');

      document.getElementById('article').innerHTML = `
        <div class="entry-date">
          ${escapeHTML(formatDate(selected.date))}
        </div>

        <h2>${escapeHTML(selected.title)}</h2>

        ${
          selected.image
            ? `<img
                 class="article-cover"
                 src="${escapeHTML(selected.image)}"
                 alt="${escapeHTML(selected.imageAlt || selected.title)}"
               >`
            : ''
        }

        <div class="prose">
          ${paras}
        </div>

        <div class="endmark" aria-hidden="true">
          ✧ ✧ ✧
        </div>
      `;

    } else {

      // Display all diary cards
      document.getElementById('cards').innerHTML = entries.length
        ? entries.map(e => `
            <a class="card" href="?post=${encodeURIComponent(e.id)}">

              <div class="cover">
                ${cover(e)}
              </div>

              <div class="card-content">

                <div class="entry-date">
                  ${escapeHTML(formatDate(e.date))}
                </div>

                <h2>${escapeHTML(e.title)}</h2>

                <p>
                  ${escapeHTML(
                    e.excerpt ||
                    (e.paragraphs || [])[0]?.slice(0, 125) ||
                    ''
                  )}
                </p>

                <span class="read-more">
                  STEP INSIDE →
                </span>

              </div>
            </a>
          `).join('')
        : '<p>還沒有日記，請在 diaries.js 新增第一篇。</p>';
    }
  </script>

</body>
</html>
